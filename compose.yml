# Local development only: Postgres, a one-shot migration, then the API; and
# Temporal's dev server with the orchestrator and the processor serving it.
#
#   docker compose up --build
#   curl localhost:8000/healthz
#   open http://localhost:8233   (Temporal's UI)
#
# Passwords here are dev-only. Locally the owner is the image's superuser; in
# production the owner is a dedicated non-superuser role, and neither DSN is
# ever given to the other process.
#
# Real tokens need a real issuer: set FISHSENSE_OIDC_ISSUER (and, if needed,
# FISHSENSE_OIDC_AUDIENCES) in your shell or a .env file before `up`. Ingest
# needs the NAS, and label sync needs Label Studio: set FISHSENSE_NAS_* and
# FISHSENSE_LABEL_STUDIO_* the same way. Without them the orchestrator still
# starts and serves its queue; only the calls out to them fail.
#
# The orchestrator acts for a tenant only as a member of it: grant
# `service:fishsense-orchestrator` a membership, as an admin, before ingesting.

services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: fishsense_owner
      POSTGRES_PASSWORD: owner-dev-only
      POSTGRES_DB: fishsense
      FISHSENSE_APP_PASSWORD: app-dev-only
      FISHSENSE_BACKUP_PASSWORD: backup-dev-only
    volumes:
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishsense_owner -d fishsense"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: api
    command: ["fishsense-services-api", "migrate"]
    environment:
      FISHSENSE_MIGRATION_DATABASE_URL: postgresql+psycopg://fishsense_owner:owner-dev-only@postgres/fishsense
      FISHSENSE_APP_ROLE: fishsense_app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      FISHSENSE_DATABASE_URL: postgresql+asyncpg://fishsense_app:app-dev-only@postgres/fishsense
      FISHSENSE_OIDC_ISSUER: ${FISHSENSE_OIDC_ISSUER:-https://auth.example.invalid/application/o/fishsense/}
      FISHSENSE_OIDC_AUDIENCES: ${FISHSENSE_OIDC_AUDIENCES:-fishsense-web,fishsense-mobile}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "fishsense"]
    ports:
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe",
             "--namespace", "fishsense", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 3s
      retries: 30

  orchestrator:
    build:
      context: .
      target: orchestrator
    environment:
      FISHSENSE_DATABASE_URL: postgresql+asyncpg://fishsense_app:app-dev-only@postgres/fishsense
      FISHSENSE_ORCHESTRATOR_SUB: service:fishsense-orchestrator
      FISHSENSE_TEMPORAL_ADDRESS: temporal:7233
      FISHSENSE_TEMPORAL_NAMESPACE: fishsense
      FISHSENSE_NAS_URL: ${FISHSENSE_NAS_URL:-https://nas.example.invalid:6021}
      FISHSENSE_NAS_USERNAME: ${FISHSENSE_NAS_USERNAME:-}
      FISHSENSE_NAS_PASSWORD: ${FISHSENSE_NAS_PASSWORD:-}
      FISHSENSE_NAS_RAW_ROOT_PATH: ${FISHSENSE_NAS_RAW_ROOT_PATH:-/fishsense_data/REEF/data}
      FISHSENSE_LABEL_STUDIO_URL: ${FISHSENSE_LABEL_STUDIO_URL:-https://label-studio.example.invalid}
      FISHSENSE_LABEL_STUDIO_API_KEY: ${FISHSENSE_LABEL_STUDIO_API_KEY:-}
      # Where Label Studio presigns the processed JPEGs (the populate stages';
      # production: labels-fishsense-lite, no prefix -- docs/port-plan.md).
      FISHSENSE_LABEL_STUDIO_S3_BUCKET: ${FISHSENSE_LABEL_STUDIO_S3_BUCKET:-labels-fishsense-lite}
      FISHSENSE_LABEL_STUDIO_S3_ENDPOINT_URL: ${FISHSENSE_LABEL_STUDIO_S3_ENDPOINT_URL:-http://garage.example.invalid:3900}
      FISHSENSE_LABEL_STUDIO_S3_REGION: ${FISHSENSE_LABEL_STUDIO_S3_REGION:-garage}
      FISHSENSE_LABEL_STUDIO_S3_ACCESS_KEY: ${FISHSENSE_LABEL_STUDIO_S3_ACCESS_KEY:-unset}
      FISHSENSE_LABEL_STUDIO_S3_SECRET_KEY: ${FISHSENSE_LABEL_STUDIO_S3_SECRET_KEY:-unset}
      # Garage (PLAN.md §9.11). Placeholders until set: the worker starts, and only
      # staging and JPEG checks fail. Production also sets LABELS_BUCKET.
      FISHSENSE_OBJECT_STORE_ENDPOINT_URL: ${FISHSENSE_OBJECT_STORE_ENDPOINT_URL:-http://garage.example.invalid:3900}
      FISHSENSE_OBJECT_STORE_REGION: ${FISHSENSE_OBJECT_STORE_REGION:-garage}
      FISHSENSE_OBJECT_STORE_ACCESS_KEY_ID: ${FISHSENSE_OBJECT_STORE_ACCESS_KEY_ID:-unset}
      FISHSENSE_OBJECT_STORE_SECRET_ACCESS_KEY: ${FISHSENSE_OBJECT_STORE_SECRET_ACCESS_KEY:-unset}
      FISHSENSE_OBJECT_STORE_BUCKET: ${FISHSENSE_OBJECT_STORE_BUCKET:-fishsense-lite}
      FISHSENSE_OBJECT_STORE_LEGACY_LABELS_PREFIX: ${FISHSENSE_OBJECT_STORE_LEGACY_LABELS_PREFIX:-fishsense-lite}
      # The S3 storage Label Studio presigns processed JPEGs with (the populate
      # stages). Placeholders until set: the worker starts, and only a populate
      # that registers a project's storage fails.
      FISHSENSE_LABEL_STUDIO_S3_BUCKET: ${FISHSENSE_LABEL_STUDIO_S3_BUCKET:-labels-fishsense-lite}
      FISHSENSE_LABEL_STUDIO_S3_ENDPOINT_URL: ${FISHSENSE_LABEL_STUDIO_S3_ENDPOINT_URL:-http://garage.example.invalid:3900}
      FISHSENSE_LABEL_STUDIO_S3_REGION: ${FISHSENSE_LABEL_STUDIO_S3_REGION:-garage}
      FISHSENSE_LABEL_STUDIO_S3_ACCESS_KEY: ${FISHSENSE_LABEL_STUDIO_S3_ACCESS_KEY:-unset}
      FISHSENSE_LABEL_STUDIO_S3_SECRET_KEY: ${FISHSENSE_LABEL_STUDIO_S3_SECRET_KEY:-unset}
      # No FISHSENSE_NRP_KUBECONFIG_PATH: standing the processor up on NRP is
      # off, and its wakes are no-ops -- the processor below is always up.
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  # The nightly backup (03:00 UTC): pg_dump to the NAS as the backup role, which
  # reads every tenant's rows and writes none (deploy/local/initdb/02-backup-role.sh).
  # Its own process and queue, so neither the API nor the orchestrator ever holds
  # that credential. Without a real NAS the schedule still registers; only the
  # night's upload fails.
  backup:
    build:
      context: .
      target: backup
    environment:
      FISHSENSE_BACKUP_DATABASE_HOST: postgres
      FISHSENSE_BACKUP_DATABASE_USER: fishsense_backup
      FISHSENSE_BACKUP_DATABASE_PASSWORD: backup-dev-only
      FISHSENSE_BACKUP_DATABASES: '["fishsense"]'
      FISHSENSE_BACKUP_NAS_ROOT_PATH: ${FISHSENSE_BACKUP_NAS_ROOT_PATH:-/fishsense_backups_dev}
      FISHSENSE_TEMPORAL_ADDRESS: temporal:7233
      FISHSENSE_TEMPORAL_NAMESPACE: fishsense
      FISHSENSE_NAS_URL: ${FISHSENSE_NAS_URL:-https://nas.example.invalid:6021}
      FISHSENSE_NAS_USERNAME: ${FISHSENSE_NAS_USERNAME:-}
      FISHSENSE_NAS_PASSWORD: ${FISHSENSE_NAS_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  # The processor's light role (stage 1 so far). No database or NAS access:
  # everything it needs arrives in the workflow payload. On NRP each role is
  # its own Deployment, stood up and torn down by the orchestrator; here it
  # simply runs. A stage on another role adds a service like this one, with
  # its own FISHSENSE_PROCESSOR_ROLE.
  processor:
    build:
      context: .
      target: processor
    environment:
      FISHSENSE_PROCESSOR_ROLE: light
      FISHSENSE_TEMPORAL_ADDRESS: temporal:7233
      FISHSENSE_TEMPORAL_NAMESPACE: fishsense
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres-data:
