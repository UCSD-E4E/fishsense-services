# Local development only: Postgres, a one-shot migration, then the API.
#
#   docker compose up --build
#   curl localhost:8000/healthz
#
# Passwords here are dev-only. Locally the owner is the image's superuser; in
# production the owner is a dedicated non-superuser role, and neither DSN is
# ever given to the other process.
#
# Real tokens need a real issuer: set FISHSENSE_OIDC_ISSUER (and, if needed,
# FISHSENSE_OIDC_AUDIENCES) in your shell or a .env file before `up`.

services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: fishsense_owner
      POSTGRES_PASSWORD: owner-dev-only
      POSTGRES_DB: fishsense
      FISHSENSE_APP_PASSWORD: app-dev-only
    volumes:
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishsense_owner -d fishsense"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["fishsense-services-api", "migrate"]
    environment:
      FISHSENSE_MIGRATION_DATABASE_URL: postgresql+psycopg://fishsense_owner:owner-dev-only@postgres/fishsense
      FISHSENSE_APP_ROLE: fishsense_app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      FISHSENSE_DATABASE_URL: postgresql+asyncpg://fishsense_app:app-dev-only@postgres/fishsense
      FISHSENSE_OIDC_ISSUER: ${FISHSENSE_OIDC_ISSUER:-https://auth.example.invalid/application/o/fishsense/}
      FISHSENSE_OIDC_AUDIENCES: ${FISHSENSE_OIDC_AUDIENCES:-fishsense-web,fishsense-mobile}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
