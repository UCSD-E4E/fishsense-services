[project]
name = "fishsense-services"
version = "0.0.0"
description = "FishSense v2 monorepo (workspace root — see services/ for the deliverables)."
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.10.0",
]
