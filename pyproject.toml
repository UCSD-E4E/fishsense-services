[project]
name = "fishsense-services"
version = "0.73.0"
description = "FishSense v2 monorepo (workspace root — see services/ for the deliverables)."
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false
override-dependencies = [
    # SAM3 (the processor's `torch` extra) declares `numpy>=1.26,<2`, which is
    # stale rather than real: fishsense-lite has run it end to end on numpy
    # 2.4.6, and fishsense-core requires numpy>=2.3.5, so without this the
    # processor cannot resolve at all (fishsense-lite's root pyproject, same
    # override). Revisit if SAM3 publishes a wheel with an honest pin.
    "numpy",
    # fishsense-core 4.3.0 requires OpenCV 5 (its checkerboard detector), and
    # every label-studio-sdk caps it below 5 (2.0.19: <5; 2.0.20+: <4.13). One
    # workspace, one lock: without this the processor and the orchestrator
    # cannot resolve together. The orchestrator uses only the SDK's API client
    # (`label_studio_sdk.client`, `.core`), not its image converters, and its
    # suite passes on OpenCV 5. Revisit if label-studio-sdk lifts its cap.
    # Bounded above: an override replaces core's own constraint too, so an
    # open range would let a lock refresh take OpenCV 6 unchecked (review of
    # #348). tests/test_dependency_pins.py checks each reason still holds.
    "opencv-python-headless>=5.0.0.93,<6",
]

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.10.0",
    # An in-process S3 for the object-store tests (Garage speaks S3).
    "moto[s3]>=5.0.0",
]

# The production deploy's invariant tests (deploy/tests) and the repo-wide
# architecture rules (tests/): `uv run pytest` from the repo root. Each service keeps its own suite, and its own configuration,
# under services/*/.
[tool.pytest.ini_options]
testpaths = ["deploy/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: real Postgres (Docker, via testcontainers)",
]
# The Label Studio SDK's own legacy (pydantic v1) validators; not ours.
filterwarnings = ["ignore::DeprecationWarning:label_studio_sdk.*"]
