[project]
name = "fishsense-services"
version = "0.1.1"
description = "FishSense v2 monorepo (workspace root — see services/ for the deliverables)."
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false
override-dependencies = [
    # SAM3 (the processor's `torch` extra) declares `numpy>=1.26,<2`, which is
    # stale rather than real: fishsense-lite has run it end to end on numpy
    # 2.4.6, and fishsense-core requires numpy>=2.3.5, so without this the
    # processor cannot resolve at all (fishsense-lite's root pyproject, same
    # override). Revisit if SAM3 publishes a wheel with an honest pin.
    "numpy",
]

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.10.0",
    # An in-process S3 for the object-store tests (Garage speaks S3).
    "moto[s3]>=5.0.0",
]

# The production deploy's invariant tests (deploy/tests) and the repo-wide
# architecture rules (tests/): `uv run pytest` from the repo root. Each service keeps its own suite, and its own configuration,
# under services/*/.
[tool.pytest.ini_options]
testpaths = ["deploy/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: real Postgres (Docker, via testcontainers)",
]
# The Label Studio SDK's own legacy (pydantic v1) validators; not ours.
filterwarnings = ["ignore::DeprecationWarning:label_studio_sdk.*"]
