[project]
name = "fishsense-services-processor"
version = "0.63.1"
description = "FishSense v2 processor: the compute side of the pipeline, ported from v1's data-worker."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fishsense-services-contracts",
    "temporalio>=1.15.0",
    "pydantic>=2.11",
    # Pinned to v1's lock (fishsense-lite@a8b2c3bc): stage 1's clusters must
    # match v1's for the same timestamps, and HDBSCAN is where they come from.
    "scikit-learn==1.9.0",
    # Was the wheel v1 ran at the freeze (PLAN.md §6.3; 4.1.0): the line fit
    # (#82, #85), CameraIntrinsics without the API SDK (#83), and the model
    # loader (#84). 4.3.0 (2026-10-23) carries the measurement code services
    # adopts in place of its own copies: find_fish_at_dot with SAM's score
    # gate, plane geometry, laser point and length, the calibration guards,
    # laser colour, the reflection split, checkerboard detection, size
    # constancy and the line fitters. It needs OpenCV 5 (the root override),
    # so a row's recorded core_version also names its OpenCV: 4.3.0 rows are
    # OpenCV 5, earlier rows OpenCV 4 (test_dependency_pins checks core's
    # requirement). 4.3.1 (2026-10-25) changes only the checkerboard
    # detector (#114): a corner a laser dot dragged is repaired, and several
    # seeds are tried. Checked on all 745 production checkerboard frames
    # (#353).
    # 4.3.2 (2026-10-25) fixes size constancy (core #113): a pair whose
    # inliers collapse to one spot measures no scale, and every solved pair
    # is bounded at 10x, so session 114 keeps frame 7. It also stops
    # preloading NVBLAS. Re-fitted on every cohort dive in a read-only dry
    # run before AUTOMATIC_CALIBRATION_VERSION size-constancy-3 shipped
    # (#354).
    # Base install only -- torch is behind the `torch` extra below.
    "fishsense-core==4.3.2",
    "boto3>=1.35.0",
    "pymupdf>=1.26.6",
    "pandas>=2.3.3",
    "platformdirs>=4.3.8",
]

[project.optional-dependencies]
# The GPU role (laser prediction, SAM 3.1 head/tail) and the slate board mask.
# Kept out of the base install so CI and the per-image and light images don't
# pull torch and its CUDA runtime. The GPU image installs `--extra torch`.
torch = [
    "fishsense-core[laser-detector,slate,headtail-keypoints]==4.3.2",
    # SAM3: Meta publishes no wheel. Pinned to v1's commit so the stage can't
    # change under HEADTAIL_PREDICTOR_VERSION without a visible diff.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@8e451d5eb43c817b64ae7577fb7b9ae223db88a9",
    # sam3 imports pkg_resources, which setuptools REMOVED in 82.0.0; v1
    # measured 81.0.0 as the last release that ships it (prod, 2026-09-07).
    # A Dependabot bump widened this to <84 (2026-10-01) and broke SAM 3.1
    # on the GPU image; tests/test_dependency_pins.py now holds the line.
    "setuptools>=80.9.0,<82",
    # Imported by sam3's model_builder chain but never declared by it (v1 found
    # them one ModuleNotFoundError at a time).
    "einops>=0.8.0",
    "psutil>=6.0.0",
    "pycocotools>=2.0.8",
    # BioCLIP 2.5 / 2 (the species pre-annotation stage, new in v2): open_clip
    # builds the model from the verified weights. Pinned to the release
    # coral-gardeners-fish-detector@67c8627 ran, so the stage can't change
    # under SPECIES_PREDICTOR_VERSION without a visible diff; 3.x reads a
    # `local-dir:` model, which is how the verified weights load offline.
    "open-clip-torch==3.3.0",
    # The slate presence detector (new in v2) builds torchvision's
    # EfficientNet-B0 and its v2 transforms, as 2026-10-03_slate_detector
    # trained it. Already locked through open-clip-torch and fishsense-core's
    # extras; declared because the stage imports it directly.
    "torchvision",
]

[project.scripts]
fishsense-services-processor = "fishsense_services_processor.worker:run"

[tool.uv.sources]
fishsense-services-contracts = { workspace = true }
fishsense-core = [
    { url = "https://github.com/UCSD-E4E/fishsense-core/releases/download/fishsense-core-v4.3.2/fishsense_core-4.3.2-cp313-cp313-manylinux_2_34_x86_64.whl", marker = "python_version == '3.13'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# SAM3 is a pinned git reference (Meta publishes no wheel).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_processor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
