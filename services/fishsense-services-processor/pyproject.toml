[project]
name = "fishsense-services-processor"
version = "0.0.0"
description = "FishSense v2 processor: the compute side of the pipeline, ported from v1's data-worker."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fishsense-services-contracts",
    "temporalio>=1.15.0",
    "pydantic>=2.11",
    # Pinned to v1's lock (fishsense-lite@a8b2c3bc): stage 1's clusters must
    # match v1's for the same timestamps, and HDBSCAN is where they come from.
    "scikit-learn==1.9.0",
]

[project.scripts]
fishsense-services-processor = "fishsense_services_processor.worker:run"

[tool.uv.sources]
fishsense-services-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_processor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
