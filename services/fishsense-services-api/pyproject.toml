[project]
name = "fishsense-services-api"
version = "0.0.0"
description = "FishSense v2 API: tenancy, authorization, and the control plane."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "fastapi>=0.119.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
