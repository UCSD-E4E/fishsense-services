[project]
name = "fishsense-services-contracts"
version = "0.0.0"
description = "FishSense v2 processing contract: what the orchestrator and processor exchange (PLAN.md §9.1)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11",
    # The shared Temporal connection (temporal.py) -- not the schemas, which
    # stay plain pydantic.
    "pydantic-settings>=2.10.0",
    "temporalio>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
