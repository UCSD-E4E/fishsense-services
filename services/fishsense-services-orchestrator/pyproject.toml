[project]
name = "fishsense-services-orchestrator"
version = "0.0.0"
description = "FishSense v2 orchestrator: Temporal workflows, ported from v1's api-worker."
requires-python = ">=3.13,<3.14"
dependencies = [
    # The control plane's database side (ingest_store): activities call it
    # directly, with no HTTP hop (PLAN.md §6.3).
    "fishsense-services-api",
    # >=0.2.0: SMB-preferred + throttled NAS transfers (fixes FileStation
    # download 502s). The lab's own PyO3 wheel, pinned like v1 (below).
    "synology-filestation>=0.2.0",
    "temporalio>=1.15.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10.0",
]

[tool.uv.sources]
fishsense-services-api = { workspace = true }
synology-filestation = { url = "https://github.com/UCSD-E4E/synology-filestation/releases/download/synology_filestation-v0.2.0/synology_filestation-0.2.0-cp310-abi3-manylinux_2_34_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
