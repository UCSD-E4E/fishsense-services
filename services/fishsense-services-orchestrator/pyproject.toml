[project]
name = "fishsense-services-orchestrator"
version = "0.0.0"
description = "FishSense v2 orchestrator: Temporal workflows, ported from v1's api-worker."
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
