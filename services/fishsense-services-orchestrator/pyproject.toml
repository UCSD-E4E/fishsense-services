[project]
name = "fishsense-services-orchestrator"
version = "0.0.0"
description = "FishSense v2 orchestrator: Temporal workflows, ported from v1's api-worker."
requires-python = ">=3.13,<3.14"
dependencies = [
    # The control plane's database side (ingest_store): activities call it
    # directly, with no HTTP hop (PLAN.md §6.3).
    "fishsense-services-api",
    "fishsense-services-contracts",
    # >=0.2.0: SMB-preferred + throttled NAS transfers (fixes FileStation
    # download 502s). The lab's own PyO3 wheel, pinned like v1 (below).
    "synology-filestation>=0.2.0",
    "temporalio>=1.15.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10.0",
    # Pinned to v1's lock (fishsense-lite@a8b2c3bc): the sync reads its task
    # shapes -- annotations as dicts, the lazy pager -- as v1 does.
    "label-studio-sdk==2.0.19",
]

[project.scripts]
fishsense-services-orchestrator = "fishsense_services_orchestrator.worker:run"

[dependency-groups]
# The processor, for the wiring test that runs stage 1 across both packages.
dev = ["fishsense-services-processor"]

[tool.uv.sources]
fishsense-services-processor = { workspace = true }
fishsense-services-contracts = { workspace = true }
fishsense-services-api = { workspace = true }
synology-filestation = { url = "https://github.com/UCSD-E4E/synology-filestation/releases/download/synology_filestation-v0.2.0/synology_filestation-0.2.0-cp310-abi3-manylinux_2_34_x86_64.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishsense_services_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
# The Label Studio SDK's own legacy (pydantic v1) validators; not ours.
filterwarnings = ["ignore::DeprecationWarning:label_studio_sdk.*"]
