name: Release

# release-please: ONE version for the whole monorepo (release-please-config.json,
# a single `.` package, tag `vX.Y.Z`). fishsense-lite versioned each service on
# its own (`<pkg>-vX.Y.Z`); v2's API, orchestrator, processor, backup and web
# are released together because they are tested together -- the contract
# package, the migrations and the web's generated client tie them -- and a
# release promotes every image to the same tag (promote.yml).
#
# Kept from fishsense-lite's release.yml: the GitHub App token (so the release
# PR's own CI runs; GITHUB_TOKEN-created PRs don't trigger workflows) and the
# uv.lock refresh. Dropped: the SDK-consumer cascade (v2 has no SDK package).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

  # Keep uv.lock's workspace-member versions in step with the pyproject
  # versions release-please just bumped (extra-files in
  # release-please-config.json). fishsense-lite's reasoning, unchanged:
  # release-please knows nothing about uv.lock, the Dockerfile's
  # `uv sync --frozen` consumes the lock WITHOUT checking it against the
  # pyprojects, so drift never shows as a red build -- it shows as a dependency
  # newly added to a pyproject missing from the image. A `uv lock --check` gate
  # would red-X every release PR by construction; refreshing right after the
  # release keeps main convergent without fighting the release flow.
  refresh-uv-lock:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      # Only the workspace members' own `version` lines move: no third-party
      # constraint changed, so uv keeps the rest of the resolution as-is.
      - name: Refresh lockfile
        run: uv lock

      # No-ops when the lock was already in step — create-pull-request opens
      # nothing on a clean tree.
      - name: Open lockfile-refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto-lock/uv-refresh
          base: main
          delete-branch: true
          title: "chore(deps): refresh uv.lock after release"
          commit-message: |
            chore(deps): refresh uv.lock after release

            Auto-generated by release.yml. Realigns uv.lock's workspace-member
            versions with the pyproject versions release-please just bumped.
          body: |
            Auto-generated by `.github/workflows/release.yml` after
            release-please cut a release.

            `uv.lock` records a version for every workspace member, but
            release-please only rewrites the pyprojects. Expect this diff to
            contain only workspace-member `version` lines.
          labels: |
            auto
            deps
