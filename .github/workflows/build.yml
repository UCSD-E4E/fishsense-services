name: Build

# Builds every image. On push to main, pushes each to GHCR tagged by the commit
# SHA so promote.yml can retag it to the release version later (release:
# published). On pull_request, builds only — no push — as a Dockerfile-validity
# check.
#
# Mirrors fishsense-lite's build.yml. We deliberately split build (this
# workflow) from promote so a release-please merge doesn't rebuild: promote
# retags an already-pushed SHA-tagged image. That also rules out the race where
# a newer non-release commit gets promoted by accident: the release tag points
# at a specific SHA, and we only ever promote the images built from that SHA.
#
# Six images, one Dockerfile (targets) plus the web's own. The list is shared
# with promote.yml and rebuild-from-main.yml; deploy/tests pins that they agree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fishsense-services-api
            dockerfile: Dockerfile
            target: api
          - image: fishsense-services-orchestrator
            dockerfile: Dockerfile
            target: orchestrator
          - image: fishsense-services-backup
            dockerfile: Dockerfile
            target: backup
          - image: fishsense-services-processor
            dockerfile: Dockerfile
            target: processor
          - image: fishsense-services-processor-gpu
            dockerfile: Dockerfile
            target: processor-gpu
          # Built with the repo root as context, like the Python images.
          - image: fishsense-services-web
            dockerfile: apps/web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      # torch + its CUDA runtime outgrow the hosted runner's free disk.
      - name: Free disk space (GPU image)
        if: matrix.image == 'fishsense-services-processor-gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner because GHCR repo paths must be lowercase
      # (UCSD-E4E -> ucsd-e4e).
      - name: Compute lowercased image name
        id: img
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner_lc}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', steps.img.outputs.name) || '' }}
